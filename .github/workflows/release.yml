name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies (tesseract + imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng imagemagick
          if ! command -v magick >/dev/null 2>&1 && command -v convert >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Package release archive
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ -n "${INPUT_TAG}" ]]; then
            VERSION="${INPUT_TAG}"
          fi
          echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"

          mkdir -p dist/stage
          cp -a \
            main.qml \
            Clipboard.qml \
            SettingsWindow.qml \
            OcrOverlay.qml \
            capture.sh \
            ClipboardHistory.js \
            EditorEngine.js \
            Keybindings.js \
            SettingsStore.js \
            VimEngine.js \
            manifest.json \
            LICENSE \
            README.md \
            bin \
            Commons \
            Ui \
            assets \
            i18n \
            scripts \
            dist/stage/

          chmod +x dist/stage/bin/omarchy-clipboard dist/stage/bin/omarchy-clipboard-* dist/stage/capture.sh dist/stage/scripts/*.sh

          tar -czf "dist/cosmic-omarchy-clipboard.tar.gz" -C dist/stage .
          cp "dist/cosmic-omarchy-clipboard.tar.gz" "dist/cosmic-omarchy-clipboard-${VERSION}.tar.gz"
          cp scripts/install.sh dist/install.sh

          (cd dist && sha256sum cosmic-omarchy-clipboard.tar.gz "cosmic-omarchy-clipboard-${VERSION}.tar.gz" install.sh > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Omarchy Clipboard for COSMIC ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            dist/cosmic-omarchy-clipboard.tar.gz
            dist/cosmic-omarchy-clipboard-${{ env.RELEASE_TAG }}.tar.gz
            dist/install.sh
            dist/SHA256SUMS.txt
